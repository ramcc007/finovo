name: Company profiles

# Business summary, website, employees, head office and officers for the stock pages (Yahoo Finance).
# Weekly: the largest companies first, anything refreshed in the last 30 days is skipped.
on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'How many companies to fetch this run'
        required: false
        default: '600'
      max_age_days:
        description: 'Skip companies refreshed within this many days (0 refreshes everything)'
        required: false
        default: '30'

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '1500' }}
          PROFILE_MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '30' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ingest_company_profiles.py
