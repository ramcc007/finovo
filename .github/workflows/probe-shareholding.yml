name: Probe shareholding sources

# Temporary diagnostic: which free shareholding and bulk-deal sources answer from GitHub's servers.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/probe_shareholding.py
        env:
          PYTHONUNBUFFERED: '1'
