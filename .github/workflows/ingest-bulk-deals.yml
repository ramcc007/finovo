name: Bulk and block deals

# NSE publishes the day's bulk and block deals after the close. Two runs, in case the first is early;
# the job is safe to repeat.
on:
  schedule:
    - cron: '30 12 * * 1-5'   # 18:00 IST
    - cron: '30 14 * * 1-5'   # 20:00 IST
  workflow_dispatch:

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Load deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ingest_bulk_deals.py
