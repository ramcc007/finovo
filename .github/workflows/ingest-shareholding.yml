name: Shareholding pattern

# Quarterly filings arrive in bursts after each quarter end (mid January, April, July, October).
# A weekly run refreshes companies not updated in the last 20 days.
on:
  schedule:
    - cron: '30 20 * * 6'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: Companies to fetch (largest first)
        default: '300'
      max_age_days:
        description: Skip companies refreshed within this many days
        default: '20'

jobs:
  shareholding:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Load shareholding
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_SYMBOLS: ${{ inputs.max_symbols || '300' }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '20' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ingest_shareholding.py
