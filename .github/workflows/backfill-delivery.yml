name: Backfill delivery percentage

# One-off (re-runnable): fills delivery quantity and percentage for past days from NSE's bhavdata archive.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to go back'
        required: false
        default: '120'

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS: ${{ github.event.inputs.days || '120' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/backfill_delivery.py
